{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50/50 p-6">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] border border-gray-100 shadow-2xl p-10 text-center">
        <div class="w-16 h-16 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <h2 class="text-2xl font-black text-black tracking-tight mb-2">¿Eliminar interacción?</h2>
        <p class="text-gray-400 text-sm mb-8">Esta acción no se puede deshacer. La interacción desaparecerá del historial del cliente.</p>
        
        <form method="post" class="space-y-3">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-500 hover:bg-black text-white font-black uppercase tracking-widest py-4 rounded-2xl transition-all">
                Sí, eliminar permanentemente
            </button>
            <a href="{% url 'base:customer_detail' object.customer.id %}" class="block w-full text-[10px] font-black uppercase tracking-widest text-gray-400 py-2">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
