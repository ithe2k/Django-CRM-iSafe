{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] border border-gray-100 shadow-2xl p-10 text-center space-y-6">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-red-50 rounded-2xl mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </div>
        
        <h2 class="text-2xl font-black tracking-tighter">¿Eliminar Cliente?</h2>
        <p class="text-sm text-gray-500">
            Estás a punto de borrar a <strong class="text-black">{{ object.get_full_name }}</strong>. 
            Toda su historia de interacciones desaparecerá del sistema.
        </p>

        <form method="post" class="space-y-3">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-black uppercase tracking-widest py-4 rounded-2xl shadow-lg shadow-red-100 transition-all">
                Sí, eliminar cliente
            </button>
            <a href="{% url 'users:dashboard' %}" class="block text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-black transition-colors pt-2">
                No, volver al panel
            </a>
        </form>
    </div>
</div>
{% endblock %}
